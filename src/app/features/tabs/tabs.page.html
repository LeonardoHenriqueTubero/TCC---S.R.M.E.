<!-- A classe existe para o global.scss conseguir virar esta barra de lado no
     computador: o ion-tabs do @ionic/angular é um componente Angular e traz
     um estilo de host (flex-direction: column) que um seletor de elemento
     sozinho não supera. -->
<ion-tabs class="navegacao-principal">
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="painel">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Painel</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="musicos">
      <ion-icon name="people-outline"></ion-icon>
      <ion-label>Músicos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="casas">
      <ion-icon name="business-outline"></ion-icon>
      <ion-label>Casas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="eventos">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Eventos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="instrumentos">
      <ion-icon name="musical-notes-outline"></ion-icon>
      <ion-label>Instrumentos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="lancamentos">
      <ion-icon name="clipboard-outline"></ion-icon>
      <ion-label>Lançamentos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="relatorios">
      <ion-icon name="document-text-outline"></ion-icon>
      <ion-label>Relatórios</ion-label>
    </ion-tab-button>

    <!-- Backup não é um cadastro como os outros, é manutenção — por isso vai
         separado, no pé da barra lateral. No celular ele some daqui: sete abas
         já é o que cabe na largura de um telefone, e a oitava viraria um
         rótulo cortado. Lá a entrada vive no menu das três barrinhas. -->
    <ion-tab-button tab="backup" class="aba-de-rodape">
      <ion-icon name="save-outline"></ion-icon>
      <ion-label>Backup</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
