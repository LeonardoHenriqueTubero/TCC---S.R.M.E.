<ion-header [translucent]="true">
  <ion-toolbar>
    <app-menu-botao slot="start"></app-menu-botao>
    <ion-title>Eventos</ion-title>
    <ion-buttons slot="end">
      <app-botao-tema></app-botao-tema>
    </ion-buttons>
    <ion-buttons slot="end" class="acao-da-tela">
      <ion-button fill="solid" color="primary" routerLink="/eventos/novo">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Novo evento
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="10" offset-md="1" size-lg="8" offset-lg="2">

        @if (carregando) {
          <div class="ion-text-center ion-padding">
            <ion-spinner></ion-spinner>
          </div>
        } @else {
          <app-barra-busca
            placeholder="Buscar evento"
            substantivo="evento"
            plural="eventos"
            [termo]="termoBusca"
            [total]="eventos.length"
            [encontrados]="eventosFiltrados().length"
            (termoMudou)="termoBusca = $event"
          />

          <ion-list>
            @for (evento of eventosFiltrados(); track evento.id) {
              <ion-item>
                <ion-label>{{ evento.nome }}</ion-label>
                <ion-button slot="end" fill="clear" [routerLink]="['/eventos', evento.id, 'editar']">
                  <ion-icon slot="icon-only" name="create-outline"></ion-icon>
                </ion-button>
                <ion-button slot="end" fill="clear" color="danger" (click)="excluir(evento)">
                  <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                </ion-button>
              </ion-item>
            } @empty {
              @if (!termoBusca.trim()) {
                <ion-item>
                  <ion-label>Nenhum evento cadastrado.</ion-label>
                </ion-item>
              }
            }
          </ion-list>
        }

      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/eventos/novo">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
