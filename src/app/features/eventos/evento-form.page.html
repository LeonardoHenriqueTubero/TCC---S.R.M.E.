<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/eventos"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ modoEdicao ? 'Editar evento' : 'Novo evento' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="8" offset-md="2" size-lg="6" offset-lg="3">

        <form [formGroup]="form" (ngSubmit)="salvar()">
          <ion-item>
            <ion-input formControlName="nome" label="Nome" labelPlacement="stacked" type="text"
              [maxlength]="TAMANHO_MAXIMO.nome"></ion-input>
          </ion-item>

          <app-falta-preencher [form]="form" [rotulos]="ROTULOS" />

          <ion-button expand="block" type="submit" [disabled]="form.invalid" class="ion-margin-top">
            Salvar
          </ion-button>
        </form>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
