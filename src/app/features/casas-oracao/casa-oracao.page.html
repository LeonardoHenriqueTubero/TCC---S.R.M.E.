<ion-header [translucent]="true">
  <ion-toolbar>
    <app-menu-botao slot="start"></app-menu-botao>
    <ion-title>Casas de Oração</ion-title>
    <!-- No computador a ação principal fica na barra de título, como em
         qualquer programa de desktop; no celular ela continua sendo o botão
         flutuante, que o CSS troca conforme a largura da tela. -->
    <ion-buttons slot="end">
      <app-botao-tema></app-botao-tema>
    </ion-buttons>
    <ion-buttons slot="end" class="acao-da-tela">
      <ion-button fill="solid" color="primary" routerLink="/casas/novo">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Nova casa
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="10" offset-md="1" size-lg="8" offset-lg="2">

        @if (carregando) {
          <div class="ion-text-center ion-padding">
            <ion-spinner></ion-spinner>
          </div>
        } @else {
          <app-barra-busca
            placeholder="Buscar por nome ou cidade"
            substantivo="casa de oração"
            plural="casas de oração"
            [termo]="termoBusca"
            [total]="casas.length"
            [encontrados]="casasFiltradas().length"
            (termoMudou)="termoBusca = $event"
          />

          <ion-list>
            @for (casa of casasFiltradas(); track casa.id) {
              <!-- Os botões ficam soltos no item (o item em si não é clicável):
                   botão dentro de item clicável faz o clique disparar os dois. -->
              <ion-item>
                <ion-label>{{ casa.nome }}</ion-label>
                <ion-note slot="end">{{ casa.cidade }}</ion-note>
                <ion-button slot="end" fill="clear" [routerLink]="['/casas', casa.id, 'editar']">
                  <ion-icon slot="icon-only" name="create-outline"></ion-icon>
                </ion-button>
                <ion-button slot="end" fill="clear" color="danger" (click)="excluir(casa)">
                  <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                </ion-button>
              </ion-item>
            } @empty {
              <!-- Com busca em andamento quem explica o vazio é a barra
                   ("Nenhum resultado para..."), então aqui só sobra o caso
                   de não haver nada cadastrado. -->
              @if (!termoBusca.trim()) {
                <ion-item>
                  <ion-label>Nenhuma casa de oração cadastrada.</ion-label>
                </ion-item>
              }
            }
          </ion-list>
        }

      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/casas/novo">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
