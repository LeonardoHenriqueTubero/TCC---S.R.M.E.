<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/musicos"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ modoEdicao ? 'Editar músico' : 'Novo músico' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="8" offset-md="2" size-lg="6" offset-lg="3">

        <form [formGroup]="form" (ngSubmit)="salvar()">
          <ion-item>
            <ion-label position="stacked">Nome</ion-label>
            <ion-input formControlName="nome" type="text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Cargo</ion-label>
            <ion-input formControlName="cargo" type="text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Oficializado</ion-label>
            <ion-input formControlName="oficializado" type="text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Batizado</ion-label>
            <ion-input formControlName="batizado" type="text"></ion-input>
          </ion-item>

          <ion-item>
            <ion-select
              formControlName="comum_congregacao"
              label="Casa de oração"
              labelPlacement="stacked"
              placeholder="Selecione a casa de oração"
              interface="action-sheet"
            >
              @for (casa of casas; track casa.id) {
                <ion-select-option [value]="casa.id">{{ casa.nome }} — {{ casa.cidade }}</ion-select-option>
              }
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-select
              formControlName="instrumento"
              label="Instrumento"
              labelPlacement="stacked"
              placeholder="Selecione o instrumento"
              interface="action-sheet"
            >
              @for (instrumento of instrumentos; track instrumento.id) {
                <ion-select-option [value]="instrumento.id">{{ instrumento.nome }} ({{ instrumento.familia }})</ion-select-option>
              }
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-label>Ativo</ion-label>
            <ion-toggle formControlName="ativo" slot="end"></ion-toggle>
          </ion-item>

          <ion-button expand="block" type="submit" [disabled]="form.invalid || modoEdicao" class="botao-salvar">
            Salvar
          </ion-button>
        </form>

      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
