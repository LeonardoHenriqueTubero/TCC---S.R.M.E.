<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Músicos</ion-title>
    <!-- No computador a ação principal fica na barra de título, como em
         qualquer programa de desktop; no celular ela continua sendo o botão
         flutuante, que o CSS troca conforme a largura da tela. -->
    <ion-buttons slot="end">
      <app-botao-tema></app-botao-tema>
    </ion-buttons>
    <ion-buttons slot="end" class="acao-da-tela">
      <ion-button fill="solid" color="primary" routerLink="/musicos/novo">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Novo músico
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="10" offset-md="1" size-lg="8" offset-lg="2">

        @if (carregando) {
          <div class="carregando">
            <ion-spinner></ion-spinner>
          </div>
        } @else {
          <!-- Cabeçalho das colunas: existe só no computador, onde a lista tem
               largura para virar tabela. No celular ele fica escondido e a
               linha continua sendo nome e cargo, um sobre o outro. -->
          <div class="cabecalho-tabela">
            <span class="coluna-principal">Nome</span>
            <span class="coluna">Instrumento</span>
            <span class="coluna">Casa de oração</span>
            <span class="coluna-acoes"></span>
          </div>

          <ion-list>
            @for (musico of musicos; track musico.id) {
              <!-- Os botões ficam soltos no item (o item em si não é clicável):
                   botão dentro de item clicável faz o clique disparar os dois. -->
              <ion-item>
                <ion-label>
                  <h2>{{ musico.nome }}</h2>
                  <p>{{ musico.cargo }}</p>
                </ion-label>
                <div slot="end" class="colunas-tabela">
                  <span class="coluna">{{ musico.instrumentoNome ?? '—' }}</span>
                  <span class="coluna">{{ musico.casaNome ?? '—' }}</span>
                </div>
                <ion-button slot="end" fill="clear" [routerLink]="['/musicos', musico.id, 'editar']">
                  <ion-icon slot="icon-only" name="create-outline"></ion-icon>
                </ion-button>
                <ion-button slot="end" fill="clear" color="danger" (click)="excluir(musico)">
                  <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                </ion-button>
              </ion-item>
            } @empty {
              <ion-item>
                <ion-label>Nenhum músico cadastrado ainda.</ion-label>
              </ion-item>
            }
          </ion-list>
        }

      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/musicos/novo">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
