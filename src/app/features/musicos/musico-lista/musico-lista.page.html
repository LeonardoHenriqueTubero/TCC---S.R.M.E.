<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Músicos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="10" offset-md="1" size-lg="8" offset-lg="2">

        @if (carregando) {
          <div class="carregando">
            <ion-spinner></ion-spinner>
          </div>
        } @else {
          <ion-list>
            @for (musico of musicos; track musico.id) {
              <ion-item-sliding>
                <ion-item [routerLink]="['/musicos', musico.id, 'editar']" button detail="true">
                  <ion-label>
                    <h2>{{ musico.nome }}</h2>
                    <p>{{ musico.cargo }}</p>
                  </ion-label>
                </ion-item>
                <ion-item-options side="end">
                  <ion-item-option color="danger" (click)="excluir(musico)">
                    <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                  </ion-item-option>
                </ion-item-options>
              </ion-item-sliding>
            } @empty {
              <ion-item>
                <ion-label>Nenhum músico cadastrado ainda.</ion-label>
              </ion-item>
            }
          </ion-list>
        }

      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/musicos/novo">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
