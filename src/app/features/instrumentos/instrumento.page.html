<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Instrumentos</ion-title>
    <!-- No computador a ação principal fica na barra de título, como em
         qualquer programa de desktop; no celular ela continua sendo o botão
         flutuante, que o CSS troca conforme a largura da tela. -->
    <ion-buttons slot="end">
      <app-botao-tema></app-botao-tema>
    </ion-buttons>
    <ion-buttons slot="end" class="acao-da-tela">
      <ion-button fill="solid" color="primary" routerLink="/instrumentos/novo">
        <ion-icon slot="start" name="add-outline"></ion-icon>
        Novo instrumento
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="10" offset-md="1" size-lg="8" offset-lg="2">

        @if (carregando) {
          <div class="ion-text-center ion-padding">
            <ion-spinner></ion-spinner>
          </div>
        } @else {
          <ion-list>
            @for (grupo of grupos; track grupo.familia) {
              <ion-item-group>
                <ion-item-divider>
                  <ion-label>{{ grupo.familia }}</ion-label>
                </ion-item-divider>
                @for (instrumento of grupo.instrumentos; track instrumento.id) {
                  <!-- Os botões ficam soltos no item (o item em si não é clicável):
                       botão dentro de item clicável faz o clique disparar os dois. -->
                  <ion-item>
                    <ion-label>{{ instrumento.nome }}</ion-label>
                    <ion-button
                      slot="end"
                      fill="clear"
                      [routerLink]="['/instrumentos', instrumento.id, 'editar']"
                    >
                      <ion-icon slot="icon-only" name="create-outline"></ion-icon>
                    </ion-button>
                    <ion-button slot="end" fill="clear" color="danger" (click)="excluir(instrumento)">
                      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
                    </ion-button>
                  </ion-item>
                }
              </ion-item-group>
            } @empty {
              <ion-item>
                <ion-label>Nenhum instrumento cadastrado.</ion-label>
              </ion-item>
            }
          </ion-list>
        }

      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/instrumentos/novo">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
